<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Campfire</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div id="backdrop" class="backdrop" data-mode="sky" aria-hidden="true">
  <img class="bd-sky" src="lobby-sky.jpg" alt="">
  <video class="bd-title" src="title-loop.mp4" poster="title-poster.jpg" muted loop playsinline preload="auto"></video>
  <video class="bd-transition" src="lobby-transition.mp4" muted playsinline preload="auto"></video>
</div>
<div id="app"></div>
<div id="banner" class="banner"></div>
<div id="ready-badge" class="ready-badge"></div>
<div id="float-timer" class="float-timer">
  <div class="timer-bar"><div class="timer-fill" id="float-fill"></div></div>
  <span class="timer-num" id="float-num"></span>
  <div id="float-controls"></div>
</div>
<div id="toast" class="toast"></div>
<button id="leave-btn" class="leave-fixed secondary small" style="display:none;" onclick="leaveGame()">← Leave</button>
<div id="camp-sidebar" class="camp-sidebar" style="display:none;"></div>
<div class="sound-ctl" id="sound-ctl">
  <div class="vol-pop" id="vol-pop">
    <input type="range" id="vol-slider" min="0" max="100" step="1"
      oninput="setVol(this.value)" aria-label="Volume">
  </div>
  <button id="mute-btn" class="mute-btn" title="Sound &amp; volume" onclick="toggleSoundPop(event)">🔊</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="art.js"></script>
<script src="backdrop.js"></script>
<script src="sound.js"></script>
<script>
/* ==========================================================
   STORY RELAY — client
   ========================================================== */

const app = document.getElementById('app');
const banner = document.getElementById('banner');
const readyBadge = document.getElementById('ready-badge');
const socket = io();

let S = null;
let renderedKey = '';
let timerInterval = null;
let voteInterval = null;
let autoReadyRound = -1;
let afkWarnedRound = -1;
let voteSent = false;
let pendingUp = null;
let pendingDown = null;
let drafts = {};        // round -> the text you've typed (survives un-ready)
let backspaces = {};    // round -> backspace count
let lastChimedRound = -1; // so the new-round chime plays once per round
let tadaPlayed = false;   // so the results fanfare plays once

/* ---------- One clock for everyone ----------
   Every countdown is "the server's deadline minus the time now". A
   device whose own clock runs a few seconds fast or slow would count
   down out of step with the others (and could auto-submit early, or
   miss the deadline). So each state message carries the server's time,
   and all timers here read serverNow() instead of the device clock. */
let clockOffset = 0, clockSamples = 0;
function serverNow() { return Date.now() + clockOffset; }
function syncClock(st) {
  if (typeof st.now !== 'number') return;
  const est = st.now - Date.now();          // always a little low, by the network delay
  clockOffset = clockSamples++ ? Math.max(clockOffset, est) : est;   // so the highest estimate is the best
}

/* ---------- Size the interface to the window ----------
   The game screens are designed at a comfortable phone/small-laptop
   size and then scaled up as a whole on bigger windows (theme.css
   applies --ui-scale as a zoom). The title screen's signs use
   --home-scale. Both are recomputed whenever the window is resized. */
function applyUiScale() {
  const w = window.innerWidth, h = window.innerHeight;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  const root = document.documentElement.style;
  root.setProperty('--ui-scale', clamp(Math.min(w / 1120, h / 620), 1, 1.9).toFixed(3));
  root.setProperty('--home-scale', clamp(Math.min(w / 1280, h / 720), 1, 1.7).toFixed(3));
}
window.addEventListener('resize', applyUiScale);
applyUiScale();

/* ---------- Helpers ---------- */
function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function countWords(text) { return text.trim().split(/\s+/).filter(Boolean).length; }
function save(key, val) { try { localStorage.setItem(key, val); } catch (e) {} }
function load(key) { try { return localStorage.getItem(key) || ''; } catch (e) { return ''; } }

/* ---------- Sound chrome: the volume dial ---------- */
const muteBtn = document.getElementById('mute-btn');
const volPop = document.getElementById('vol-pop');
const volSlider = document.getElementById('vol-slider');

function soundIcon() {
  if (Sound.isMuted() || Sound.getVolume() === 0) return '🔇';
  if (Sound.getVolume() < 0.34) return '🔈';
  if (Sound.getVolume() < 0.67) return '🔉';
  return '🔊';
}
function syncMuteBtn() {
  muteBtn.textContent = soundIcon();
  volSlider.value = Sound.isMuted() ? 0 : Math.round(Sound.getVolume() * 100);
}

// First tap opens the slider; tapping again with the slider open mutes
function toggleSoundPop(e) {
  e.stopPropagation();
  if (volPop.classList.contains('open')) {
    Sound.toggleMute();
    syncMuteBtn();
  } else {
    volPop.classList.add('open');
    syncMuteBtn();
  }
}
function setVol(v) {
  Sound.setVolume(v / 100);
  Sound.click(); // a tick so they hear the level they're choosing
  syncMuteBtn();
}
// Clicking anywhere else tucks the slider away
document.addEventListener('pointerdown', (e) => {
  if (!document.getElementById('sound-ctl').contains(e.target)) volPop.classList.remove('open');
});
syncMuteBtn();



/* ---------- Connection plumbing ---------- */
socket.on('state', (st) => { syncClock(st); S = st; banner.style.display = 'none'; render(); });
socket.on('connect', () => {
  clockSamples = 0; // measure the clock afresh on every (re)connection
  const code = load('sr_code'), name = load('sr_name');
  if (code && name && !S) {
    socket.emit('join_room', { code, name }, (res) => { if (!res || !res.ok) renderHome(); });
  }
});
socket.on('disconnect', () => {
  banner.textContent = 'Connection lost — trying to reconnect…';
  banner.style.display = 'block';
});
// The host removed us from the room — forget it and go home so we don't auto-rejoin
socket.on('kicked', () => {
  save('sr_code', '');
  S = null;
  renderHome();
  const err = document.getElementById('home-error');
  if (err) err.textContent = 'The host removed you from that room.';
});

/* ---------- Master render ---------- */
function render() {
  if (!S) return renderHome();
  document.body.classList.remove('is-home'); // game screens use the normal centered column
  Backdrop.enterGame();                      // title scene -> (transition, if you just created the room) -> still sky
  if (S.phase !== 'reading') { stopReadAloud(); stopChain(); }
  updateChrome();

  // Someone new sat down at the fire — a little knock so the lobby notices
  if (S.phase === 'lobby') {
    const names = S.players.map(p => p.name);
    if (lobbyRoster && names.some(n => !lobbyRoster.includes(n) && n !== S.youName)) Sound.join();
    lobbyRoster = names;
  } else lobbyRoster = null;

  // The vote is in: tell everyone which theme won as the first round opens
  if (S.phase === 'writing' && S.writing.round === 0 && S.theme && S.settings.themeMode === 'vote' && announcedTheme !== S.code + '|' + S.theme) {
    announcedTheme = S.code + '|' + S.theme;
    showToast('🔥 The camp chose: ' + S.theme);
  }

  const key = screenKey();
  if (key === renderedKey) { patch(); return; }
  renderedKey = key;
  clearInterval(timerInterval);
  clearInterval(voteInterval);

  // A fresh story just landed in your hands — a gentle chime, and if the
  // tab is buried under Discord, flag the title so they see it
  if (S.phase === 'writing' && !S.writing.ready && lastChimedRound !== S.writing.round) {
    lastChimedRound = S.writing.round;
    Sound.chime();
    if (document.hidden) tabAlert('✏️ Your turn!');
  }
  if (S.phase === 'voting' && !S.voting.voted && document.hidden) tabAlert('🔥 Time to vote!');
  if (S.phase === 'results' && !tadaPlayed) { tadaPlayed = true; Sound.tada(); }
  if (S.phase !== 'results') tadaPlayed = false;

  if (S.phase === 'lobby') renderLobby();
  else if (S.phase === 'theming') renderTheming();
  else if (S.phase === 'themevote') renderThemeVote();
  else if (S.phase === 'writing') renderWriting();
  else if (S.phase === 'reading') renderReading();
  else if (S.phase === 'voting') renderVoting();
  else if (S.phase === 'results') renderResults();
}

let lobbyRoster = null;      // who was in the lobby last time we looked (for the join sound)
let announcedTheme = '';     // the winning theme we've already announced

function screenKey() {
  const h = '-' + S.isHost;   // host controls appear/disappear if the host changes
  if (S.phase === 'writing') return 'writing-' + S.writing.round + '-' + S.writing.ready + '-' + S.writing.paused + '-' + S.writing.anyDisconnected + h;
  if (S.phase === 'reading') return 'reading-' + S.reading.index + h;
  if (S.phase === 'voting') return 'voting-' + S.voting.voted + h;
  if (S.phase === 'theming') return 'theming-' + (S.theming.pitched ? 'pitched' : 'open') + h;
  if (S.phase === 'themevote') return 'themevote-' + (S.themeVote.voted !== null) + h;
  if (S.phase === 'lobby') return 'lobby-' + JSON.stringify(S.players) + JSON.stringify(S.settings) + S.isHost;
  return S.phase + h;
}

function patch() {
  if (S.phase === 'writing') {
    const list = document.getElementById('status-list');
    if (list) list.innerHTML = statusListHTML();
    const side = document.getElementById('camp-sidebar');
    if (side && side.style.display !== 'none') side.innerHTML = sidebarHTML();
  }
  if (S.phase === 'theming') {
    // Rerolled options / freshly fetched feed prompts arrive here —
    // redraw the open tab without touching what the player has typed
    const panel = document.getElementById('theme-panel');
    if (panel) panel.innerHTML = themePanelHTML();
    const w = document.getElementById('theme-waiting');
    if (w) w.textContent = themeWaitingText();
  }
  if (S.phase === 'themevote') {
    const w = document.getElementById('theme-waiting');
    if (w) w.textContent = themeVoteWaitingText();
  }
  if (S.phase === 'voting') {
    const w = document.getElementById('waiting-on');
    if (w) w.textContent = waitingText();
  }
}

/* The ready-fraction badge, timer and sidebar live outside the screens */
function updateChrome() {
  const floatTimer = document.getElementById('float-timer');
  const sidebar = document.getElementById('camp-sidebar');
  const leave = document.getElementById('leave-btn');
  const inGame = !!S;
  document.body.classList.toggle('in-game', inGame);
  // The Leave button: on every screen once you're past the lobby
  // (the lobby has its own, in its header)
  if (leave) leave.style.display = inGame && S.phase !== 'lobby' ? 'block' : 'none';
  // The top timer bar only exists in timed writing rounds; other chrome shifts down for it
  document.body.classList.toggle('timer-on', inGame && S.phase === 'writing' && !!S.writing.endsAt);

  if (inGame && S.phase === 'writing') {
    readyBadge.style.display = 'flex';
    readyBadge.innerHTML = `${mallow('gold', 18)} ${S.writing.readyCount}/${S.writing.total} ready`;
    // The live sidebar (wide screens; the in-card list covers phones)
    if (sidebar) { sidebar.style.display = 'block'; sidebar.innerHTML = sidebarHTML(); }
  } else if (inGame && S.phase === 'theming') {
    readyBadge.style.display = 'flex';
    readyBadge.innerHTML = `${mallow('gold', 18)} ${S.theming.readyCount}/${S.theming.total} pitched`;
    if (floatTimer) floatTimer.style.display = 'none';
    if (sidebar) sidebar.style.display = 'none';
  } else {
    readyBadge.style.display = 'none';
    if (floatTimer) floatTimer.style.display = 'none';
    if (sidebar) sidebar.style.display = 'none';
  }
}

/* ==========================================================
   SCREEN: HOME — the looping title scene (title-loop.mp4, run by
   backdrop.js) with the two wooden signs on top of it
   ========================================================== */
function renderHome() {
  renderedKey = 'home';
  document.body.classList.add('is-home'); // lets the scene fill the whole window (see theme.css)
  Backdrop.showTitle();
  clearInterval(timerInterval);
  clearInterval(voteInterval);
  clearInterval(themeInterval);
  lobbyRoster = null;
  updateChrome();   // S is null here, so this hides the timer, badge, sidebar and Leave button

  const params = new URLSearchParams(location.search);
  const linkedRoom = (params.get('room') || '').toUpperCase().slice(0, 4);
  const savedName = load('sr_name');

  app.innerHTML = `
  <div class="home-stage">
    <h1 class="sr-only">Campfire</h1>
    <!-- Two wooden signs, one each side of the campfire, so the fire and
         its clearing stay in view. Their placement is all in theme.css
         (".home-signs"): beside the clearing on wide windows, in the band
         between the wordmark and the fire on tall or narrow ones. -->
    <div class="home-signs">
      <div class="home-sign home-sign-create">
        <div class="sign-post"></div>
        <div class="sign-face">
          <svg class="sign-wood" viewBox="0 0 600 210" preserveAspectRatio="none" aria-hidden="true"><path d="M14 24 Q 12 8 30 9 L 552 4 L 594 105 L 550 206 L 28 200 Q 12 201 13 186 Z" fill="#7a5334" stroke="#2e1d0f" stroke-width="6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="M40 60 L 520 56 M 36 150 L 530 152" stroke="rgba(46,29,15,0.28)" stroke-width="2" fill="none" vector-effect="non-scaling-stroke"/></svg>
          <div class="sign-body">
            <label class="sign-label" for="name-input">Your camper's name</label>
            <input id="name-input" class="sign-input" type="text" maxlength="20" placeholder="What your friends call you" value="${esc(savedName)}" onkeydown="if(event.key==='Enter'){(document.getElementById('code-input').value.trim()?joinRoom():createRoom())}">
            <button class="sign-btn" onclick="createRoom()">Light a fire <span class="sign-btn-note">(create room)</span></button>
            <p class="error-msg" id="home-error"></p>
            <button class="dev-link" onclick="devQuickstart()" title="A private room with two bots — walk every phase of the game alone">🛠 Solo playtest (dev)</button>
          </div>
        </div>
      </div>
      <div class="home-sign home-sign-join">
        <div class="sign-post"></div>
        <div class="sign-face">
          <svg class="sign-wood flip" viewBox="0 0 600 210" preserveAspectRatio="none" aria-hidden="true"><path d="M14 24 Q 12 8 30 9 L 552 4 L 594 105 L 550 206 L 28 200 Q 12 201 13 186 Z" fill="#7a5334" stroke="#2e1d0f" stroke-width="6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/><path d="M40 60 L 520 56 M 36 150 L 530 152" stroke="rgba(46,29,15,0.28)" stroke-width="2" fill="none" vector-effect="non-scaling-stroke"/></svg>
          <div class="sign-body">
            <label class="sign-label" for="code-input">Join a fire with a room code</label>
            <input id="code-input" class="sign-input" type="text" maxlength="4" placeholder="e.g. WXYZ" style="text-transform:uppercase;" value="${esc(linkedRoom)}" oninput="this.value=this.value.toUpperCase()" onkeydown="if(event.key==='Enter')joinRoom()">
            <button class="sign-btn secondary" onclick="joinRoom()">Join room</button>
          </div>
        </div>
      </div>
    </div>
  </div>`;

  const nameInput = document.getElementById('name-input');
  if (nameInput) nameInput.focus();
}

function createRoom() {
  const name = document.getElementById('name-input').value.trim();
  Backdrop.arm(); // a new party: play the lift into the sky on the way to the lobby
  socket.emit('create_room', { name }, (res) => {
    if (res && res.ok) { save('sr_name', name); save('sr_code', res.code); }
    else {
      Backdrop.disarm();
      document.getElementById('home-error').textContent = (res && res.error) || 'Something went wrong.';
    }
  });
}

function devQuickstart() {
  const nameEl = document.getElementById('name-input');
  const name = (nameEl && nameEl.value.trim()) || 'Playtester';
  Backdrop.arm(); // the solo playtest room is a new party too
  socket.emit('dev_quickstart', { name }, (res) => {
    if (res && res.ok) { save('sr_name', name); save('sr_code', res.code); }
    else {
      Backdrop.disarm();
      document.getElementById('home-error').textContent = (res && res.error) || 'Something went wrong.';
    }
  });
}

function joinRoom() {
  const name = document.getElementById('name-input').value.trim();
  const code = document.getElementById('code-input').value.trim().toUpperCase();
  socket.emit('join_room', { code, name }, (res) => {
    if (res && res.ok) { save('sr_name', name); save('sr_code', res.code); }
    else document.getElementById('home-error').textContent = (res && res.error) || 'Something went wrong.';
  });
}

/* ==========================================================
   SCREEN: LOBBY
   ========================================================== */
/* A settings tile: a little wooden plaque, lit up when selected */
function tile(label, active, onclick) {
  return `<button class="tile-btn ${active ? 'on' : ''}" onclick="${onclick}">${label}</button>`;
}
function setOpt(key, value) {
  const o = {}; o[key] = value;
  socket.emit('update_settings', o);
  Sound.click();
}

function renderLobby() {
  drafts = {}; backspaces = {}; autoReadyRound = -1; voteSent = false; themeDraft = ''; themeAutoSent = false; announcedTheme = '';
  clearInterval(themeInterval);
  const s = S.settings;
  const chips = S.players.map(p => `
    <span class="player-chip">
      <span class="dot ${p.connected ? '' : 'off'}"></span>
      ${esc(p.name)}${p.isHost ? ' ★' : ''}
      ${S.isHost && !p.isHost ? `<button class="chip-kick" title="Remove ${esc(p.name)}" onclick="kickPlayer('${esc(p.name)}')">×</button>` : ''}
    </span>`).join('');

  const themeLine = { vote: 'everyone pitches a theme, then votes', host: 'the host sets the theme', none: 'no theme' }[s.themeMode] || '';

  const settingsBlock = S.isHost ? `
    <div class="field">
      <label class="camp-label">🎯 Story theme</label>
      <div class="tile-row">
        ${tile('🗳️ Everyone pitches, then vote', s.themeMode === 'vote', "setOpt('themeMode','vote')")}
        ${tile('✍️ I set the theme', s.themeMode === 'host', "setOpt('themeMode','host')")}
        ${tile('🆓 No theme', s.themeMode === 'none', "setOpt('themeMode','none')")}
      </div>
      ${s.themeMode === 'host' ? `
        <input type="text" id="host-theme" maxlength="200" style="margin-top:10px;" placeholder="The theme everyone writes from…"
          value="${esc(s.hostTheme || '')}" onchange="socket.emit('update_settings', { hostTheme: this.value })" onkeydown="if(event.key==='Enter')this.blur()">
        <p class="hint">Only you can see this until the game starts.</p>` : ''}
    </div>
    <div class="field">
      <label class="camp-label">👀 When a story lands in your hands…</label>
      <div class="tile-row">
        ${tile('📖 Whole story so far', s.visibility === 'full', "setOpt('visibility','full')")}
        ${tile('🌪️ Only the last segment', s.visibility === 'last', "setOpt('visibility','last')")}
      </div>
    </div>
    <div class="field">
      <label class="camp-label">🎭 Author names</label>
      <div class="tile-row">
        ${tile('👋 Names shown', !s.anonymous, "setOpt('anonymous',false)")}
        ${tile('🎭 Anonymous until results', s.anonymous, "setOpt('anonymous',true)")}
      </div>
    </div>
    <div class="field">
      <label class="camp-label">📣 Story mode</label>
      <div class="tile-row">
        ${tile('✍️ Text — type your part', s.mode !== 'audio', "setOpt('mode','text')")}
        ${tile('🎙️ Audio — record it', s.mode === 'audio', "setOpt('mode','audio')")}
      </div>
    </div>
    <div class="field">
      <label class="camp-label">⏱️ Timers &amp; word limits</label>
      <div class="tile-row">
        ${tile('♾️ Off — move on when everyone is ready', !s.limits, "setOpt('limits',false)")}
        ${tile('⏱️ On', s.limits, "setOpt('limits',true)")}
      </div>
    </div>
    ${s.limits ? `
    <div class="field-row">
      <div class="field">
        <label class="camp-label">⏱️ Time per round (seconds)</label>
        <input type="number" min="15" max="600" value="${s.seconds}"
          onchange="socket.emit('update_settings', { seconds: this.value })">
      </div>
      <div class="field">
        <label class="camp-label">🗳️ Voting time (seconds)</label>
        <input type="number" min="5" max="120" value="${s.votingSeconds}"
          onchange="socket.emit('update_settings', { votingSeconds: this.value })">
      </div>
    </div>
    <div class="field-row">
      <div class="field">
        <label class="camp-label">✏️ Minimum words</label>
        <input type="number" min="0" max="500" value="${s.minWords}"
          onchange="socket.emit('update_settings', { minWords: this.value })">
      </div>
      <div class="field">
        <label class="camp-label">📏 Maximum words (0 = none)</label>
        <input type="number" min="0" max="2000" value="${s.maxWords}"
          onchange="socket.emit('update_settings', { maxWords: this.value })">
      </div>
    </div>` : ''}
    <div class="btn-row">
      <button onclick="startGame()" ${S.players.length < 3 ? 'disabled' : ''}>
        ${S.players.length < 3 ? 'Need at least 3 players' : 'Gather round — start the game'}
      </button>
    </div>
    <p class="error-msg" id="lobby-error"></p>`
  : `
    <p class="subtitle">
      ${s.limits
        ? `${s.seconds}s per round · ${s.votingSeconds}s to vote · ${s.minWords}${s.maxWords > 0 ? '–' + s.maxWords : '+'} words`
        : 'no timers — each round moves on when everyone is ready'} ·
      ${s.visibility === 'full' ? 'whole story visible' : 'only the last segment visible'}${s.anonymous ? ' · anonymous authors' : ''} · ${themeLine}${s.mode === 'audio' ? ' · 🎙️ audio mode' : ''}
    </p>
    <p class="subtitle">Waiting for the fire-starter to begin…</p>`;

  // The host may be mid-sentence in the theme box when someone joins and
  // the lobby redraws — carry what they've typed (and the cursor) across
  const oldTheme = document.getElementById('host-theme');
  const typedTheme = oldTheme ? { value: oldTheme.value, focused: document.activeElement === oldTheme, at: oldTheme.selectionStart } : null;

  const joinLink = location.origin + '/?room=' + encodeURIComponent(S.code);

  app.innerHTML = `
    <div class="lobby-top">
      <button class="secondary small" onclick="leaveGame()">← Leave</button>
      <h1>Campfire</h1>
      <button class="secondary small" onclick="showHowTo()">How to play</button>
    </div>
    <div class="card" style="text-align:center;">
      <p class="subtitle">Tell your friends the room code</p>
      <div class="room-code" title="Click to copy" style="cursor:pointer;" onclick="navigator.clipboard&&navigator.clipboard.writeText(S.code).then(()=>showToast('Room code copied!'))">${esc(S.code)}</div>
      <div class="join-link-row">
        <input type="text" id="join-link" readonly value="${esc(joinLink)}" onclick="this.select()">
        <button class="small" id="copy-link-btn" onclick="copyJoinLink()">Copy link</button>
      </div>
    </div>
    <div class="card">
      <h2>Around the fire (${S.players.length}/8)</h2>
      ${chips}
    </div>
    <div class="card">
      <h2>Game settings</h2>
      ${settingsBlock}
    </div>`;

  const newTheme = document.getElementById('host-theme');
  if (typedTheme && newTheme) {
    newTheme.value = typedTheme.value;
    if (typedTheme.focused) { newTheme.focus(); try { newTheme.setSelectionRange(typedTheme.at, typedTheme.at); } catch (e) {} }
  }
}

function startGame() {
  if (S.settings.themeMode === 'host') {
    const box = document.getElementById('host-theme');
    const theme = box ? box.value.trim() : '';
    if (!theme) {
      const err = document.getElementById('lobby-error');
      if (err) err.textContent = 'Type the theme first — or pick a different theme option above.';
      if (box) box.focus();
      return;
    }
    socket.emit('update_settings', { hostTheme: theme });
  }
  socket.emit('start_game');
}

/* Leave — available on every screen. From the lobby or the results it

function leaveGame() {

      'The others carry on without you. Your seat stays open: you can come back with the same name and room code.',

  doLeave();
}
function doLeave() {
  save('sr_code', '');           // forget the room so auto-rejoin won't fire
  stopReadAloud(); stopChain();
  socket.emit('leave_room', () => {});
  S = null;
  renderHome();
}

// A small yes/no card over the page (used for leaving and for the host moving the group on)

  overlay.className = 'howto-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

  overlay.querySelector('#confirm-yes').onclick = () => { overlay.remove(); onYes(); };

// Copy the direct join link to the clipboard, with graceful fallback

  const link = document.getElementById('join-link');
  const btn = document.getElementById('copy-link-btn');
  const done = () => { if (btn) { btn.textContent = 'Copied!'; setTimeout(() => btn.textContent = 'Copy link', 1800); } };

    navigator.clipboard.writeText(link.value).then(done).catch(() => { link.select(); document.execCommand('copy'); done(); });

   SCREEN: THEMING — everyone pitches a theme…
   ========================================================== */
let themeInterval = null;
let themeDraft = '';        // what you've typed or tapped, kept if you take your pitch back
let themeAutoSent = false;  // timed games: your typed pitch is sent once when the clock runs out

// A phase clock for the pitch and theme-vote cards. Untimed games have
// no deadline, so the bar is simply not drawn.
function phaseTimerHTML(endsAt) {
  return endsAt ? `<div class="timer-wrap">
      <div class="timer-bar"><div class="timer-fill" id="theme-fill"></div></div>
      <span class="timer-num" id="theme-num"></span>
    </div>` : '';
}
function runPhaseTimer(getEndsAt, totalMs, onZero) {
  clearInterval(themeInterval);
  const tick = () => {
    const endsAt = S && getEndsAt();
    if (!endsAt) return;
    const left = Math.max(0, endsAt - serverNow());
    const fill = document.getElementById('theme-fill');
    const num = document.getElementById('theme-num');
    if (fill && num) {
      fill.style.width = Math.min(100, left / totalMs * 100) + '%';
      fill.classList.toggle('low', left <= 5000);
      const sec = Math.ceil(left / 1000);
      num.textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    }
    if (left <= 0 && onZero) onZero();
  };
  tick();
  themeInterval = setInterval(tick, 200);
}

function themeWaitingText() {
  const w = (S.theming && S.theming.waitingOn) || [];
  return w.length ? 'Still thinking: ' + w.join(', ') : 'Everyone has pitched — gathering them up…';
}

        <div class="theme-entry">

            oninput="onThemeInput()" onkeydown="if(event.key==='Enter')sendTheme()">

// One camper's live row: name, word count, ✓ / …, and the 🚨 badge.
// Used by both the in-card status list and the floating sidebar.
function campRowHTML(p) {

function themeBanner() {
  return S.theme
    ? `<div class="theme-banner"><span class="theme-label">Theme</span> ${esc(S.theme)}</div>`
    : '';

function renderWriting() {
  const w = S.writing;
  const s = S.settings;

  if (w.ready) {
    app.innerHTML = `
      <div class="card" style="text-align:center;">
        ${themeBanner()}
        ${pauseControlsHTML()}
        <h2>Marshmallow's on the fire ✓</h2>
        <p class="subtitle">Round ${w.round + 1} of ${w.totalRounds} — ${w.endsAt ? "the round ends when everyone's ready or time runs out." : "the round moves on as soon as everyone's ready."}</p>

      </div>`;
    startCountdown(false);
    return;
  }

  const isAudio = S.mode === 'audio';

  // Context: what got passed to you. In audio mode it's the previous clip.
  let context;
  if (w.context.mode === 'new') {
    context = `<p class="subtitle">You're starting a fresh story. ${isAudio ? 'Record the opening — set a scene, a character, a problem.' : 'Set the scene, introduce someone, cause a problem — anything goes.'}</p>`;
  } else if (isAudio) {
    const clip = w.context.audio && w.context.audio[0];
    context = `<p class="subtitle">Listen to the part passed to you (telephone — you only hear the last clip), then continue the story in your own recording.</p>
      ${clip ? `<audio class="clip-player" controls src="${clip}"></audio>` : '<p class="subtitle">(No previous clip came through — just keep the story going.)</p>'}`;
  } else if (w.context.mode === 'full') {
    context = `<p class="subtitle">A story has been passed to you. Here it is so far — keep it going!</p>

  } else {
    context = `<p class="subtitle">A story has been passed to you, but you can only see the most recent part. Good luck!</p>
      <div class="story-box"><div class="segment">${esc(w.context.segments[0])}</div></div>`;
  }

  const lim = w.limits;   // { min, max } — min is 1 and max is 0 (none) when limits are off
  const limitLabel = lim.max > 0 ? ` (${lim.min}–${lim.max} words)` : lim.min > 1 ? ` (at least ${lim.min} words)` : '';

  // The input area differs by mode
  const inputArea = isAudio
    ? `<div class="recorder" id="recorder">
         <button id="rec-btn" class="rec-btn" onclick="toggleRecord()">● Start recording</button>
         <span class="rec-status" id="rec-status">Tap to record your part</span>
         <audio class="clip-player" id="rec-playback" controls style="display:none;"></audio>
       </div>`
    : `<textarea id="segment-input" placeholder="Write your part here…${limitLabel}" oninput="onType()"></textarea>
       <p class="word-count" id="word-count"></p>`;

  app.innerHTML = `
    <div class="card">
      ${themeBanner()}
      ${pauseControlsHTML()}
      <h2>Round ${w.round + 1} of ${w.totalRounds}</h2>
      ${context}
      ${inputArea}
      <div class="btn-row">
        <button id="ready-btn" onclick="goReady(false)" disabled>I'm ready</button>
        ${hostMoveOn()}
      </div>
      <div class="status-list" id="status-list">${statusListHTML()}</div>
    </div>`;

  if (isAudio) {
    resetRecorder();
    startCountdown(true);
  } else {
    const input = document.getElementById('segment-input');
    input.value = drafts[w.round] !== undefined ? drafts[w.round] : loadDraft(w.round);
    input.addEventListener('keydown', (e) => {

        backspaces[w.round] = (backspaces[w.round] || 0) + 1;
      }
      // Power-typer shortcut: Ctrl/Cmd+Enter = I'm ready
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        e.preventDefault();

        if (btn && !btn.disabled) goReady(false);

    input.addEventListener('paste', () => {
      socket.emit('paste_alert');
      showToast('📋 Paste detected. The whole campfire saw that.');
    });
    updateWordCount();
    startCountdown(true);
    input.focus();
  }
}

/* ==========================================================
   AUDIO RECORDING (audio mode only)
   Uses the browser's MediaRecorder. The finished clip is held
   as a base64 data URL and sent with the 'ready' event.
   ========================================================== */
let mediaRecorder = null;
let recordedChunks = [];
let recordedClip = null;   // base64 data URL of this round's recording
let recording = false;
let autoSendAudio = null;   // set (to the seconds spent) when time runs out mid-recording

function resetRecorder() {
  recordedClip = null;
  recording = false;
  autoSendAudio = null;
  const btn = document.getElementById('ready-btn');
  if (btn) btn.disabled = true;
}

async function toggleRecord() {
  const btn = document.getElementById('rec-btn');
  const status = document.getElementById('rec-status');
  const playback = document.getElementById('rec-playback');
  const readyBtn = document.getElementById('ready-btn');

  if (recording) {
    // Stop
    mediaRecorder.stop();
    return;
  }

  // Start
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recordedChunks = [];
    mediaRecorder = new MediaRecorder(stream);
    mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedChunks.push(e.data); };
    mediaRecorder.onstop = () => {
      stream.getTracks().forEach(t => t.stop()); // release the mic
      const blob = new Blob(recordedChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      const reader = new FileReader();
      reader.onload = () => {
        recordedClip = reader.result; // data:audio/...;base64,...
        // The clock ran out mid-recording: the clip is ready now, so hand it in
        if (autoSendAudio !== null) {
          socket.emit('ready', { audio: recordedClip, seconds: autoSendAudio });
          autoSendAudio = null;
          return;
        }
        if (playback) { playback.src = recordedClip; playback.style.display = 'block'; }
        if (readyBtn) readyBtn.disabled = false;
        if (status) status.textContent = 'Recorded! Listen back, or re-record.';
        if (btn) btn.textContent = '● Re-record';
      };
      reader.readAsDataURL(blob);
      recording = false;
    };
    mediaRecorder.start();
    recording = true;
    if (btn) btn.textContent = '■ Stop recording';
    if (status) status.textContent = 'Recording… tap to stop.';
    if (playback) playback.style.display = 'none';
  } catch (err) {
    if (status) status.textContent = 'Mic blocked — allow microphone access in your browser to record.';
  }
}

let lastProgressSent = 0;
let lastProgressText = null;
let progressTimer = null;
function onType() {
  const input = document.getElementById('segment-input');
  if (input && S.writing) {
    drafts[S.writing.round] = input.value;
    saveDraft(S.writing.round, input.value); // survive a wifi drop
    // Send the draft up: at most one update per 1.5s, but always the final
    // text once typing pauses. This feeds the live word counts AND is what
    // gets handed in for you if the round ends before you press "I'm ready".
    clearTimeout(progressTimer);
    const wait = Math.max(0, 1500 - (Date.now() - lastProgressSent));
    progressTimer = setTimeout(() => {
      const el = document.getElementById('segment-input');
      if (!el || !S || !S.writing || S.writing.ready) return;
      if (el.value === lastProgressText) return;
      lastProgressSent = Date.now();
      lastProgressText = el.value;
      socket.emit('typing_progress', { words: countWords(el.value), text: el.value, backspaces: backspaces[S.writing.round] || 0 });
    }, wait);
  }
  updateWordCount();
}

// Drafts are keyed by room code + round so different rooms don't collide
function draftKey(round) { return 'sr_draft_' + (S ? S.code : '') + '_' + round; }
function saveDraft(round, text) { save(draftKey(round), text); }
function loadDraft(round) { return load(draftKey(round)); }
function clearDrafts() {
  try {
    for (let i = 0; i < 20; i++) localStorage.removeItem('sr_draft_' + (S ? S.code : '') + '_' + i);
  } catch (e) {}
}

function startCountdown(canAutoReady) {
  clearInterval(timerInterval);
  const tick = () => {
    if (!S || !S.writing) return;
    const ft = document.getElementById('float-timer');
    const fill = document.getElementById('float-fill');
    const num = document.getElementById('float-num');

    // Untimed game: no clock at all — the round ends when everyone is ready
    if (!S.writing.endsAt && !S.writing.paused) { if (ft) ft.style.display = 'none'; return; }
    const total = S.settings.seconds * 1000;

    if (S.writing.paused) {
      // Frozen: show the held time, no ticking, no auto-submit
      const left = S.writing.pausedRemaining;
      if (ft) ft.style.display = 'flex';
      if (fill && num) {
        fill.style.width = (left / total * 100) + '%';
        fill.classList.add('paused');
        num.textContent = '⏸ paused';
      }
      return;
    }

    // serverNow(), not the device clock: every player sees the same time,
    // and it reads the same before and after "Wait — keep writing"
    const left = Math.max(0, S.writing.endsAt - serverNow());
    if (ft) ft.style.display = 'flex';
    if (fill && num) {
      fill.style.width = Math.min(100, left / total * 100) + '%';
      fill.classList.toggle('low', left <= 10000);
      fill.classList.remove('paused');
      const sec = Math.ceil(left / 1000);
      num.textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    }

    // AFK warning toast at the 30-second mark (only if you haven't readied)
    if (canAutoReady && !S.writing.ready && left <= 30000 && left > 29000 && afkWarnedRound !== S.writing.round) {
      afkWarnedRound = S.writing.round;
      showToast('⏰ 30 seconds left — wrap up your part!');
    }

    // Time's up: hand in whatever is in the box. (The server also keeps the
    // draft, so this is belt and braces for a tab that was asleep.)
    if (left <= 0 && canAutoReady && autoReadyRound !== S.writing.round) {
      autoReadyRound = S.writing.round;
      goReady(true);
    }
  };
  tick();
  timerInterval = setInterval(tick, 250);
}

// The pause/resume controls — timed games only, and only the host sees the button
function pauseControlsHTML() {
  const w = S.writing;
  if (!w || (!w.endsAt && !w.paused)) return '';

  if (w.paused) {

      ${mayControl ? `<button class="small" onclick="socket.emit('resume_round')">Resume now</button>` : ''}
    </div>`;

  if (w.anyDisconnected && mayControl) {

      <span>A camper dropped — you can pause to wait for them.</span>
      <button class="small secondary" onclick="socket.emit('pause_round')">Pause round</button>
    </div>`;

}

// A brief toast notification, top-center

/* Flag the browser tab when something needs you and you're off in

const BASE_TITLE = document.title || 'Campfire';

/* Connection hiccups: say so, quietly */
let wasConnected = false;
socket.on('disconnect', () => {
  if (wasConnected && S) showToast('📡 Connection lost — reconnecting…');
});
socket.io.on('reconnect', () => {
  if (S) showToast('📡 Reconnected!');
});

function updateWordCount() {
  const input = document.getElementById('segment-input');
  const counter = document.getElementById('word-count');
  const btn = document.getElementById('ready-btn');
  if (!input || !counter || !btn) return;
  const lim = S.writing.limits;
  const w = countWords(input.value);
  const overMax = lim.max > 0 && w > lim.max;
  const underMin = w < lim.min;

  if (!S.settings.limits) {
    // No word limits: just a friendly count; anything at all can be handed in
    counter.textContent = w === 1 ? '1 word' : `${w} words`;
    counter.className = 'word-count' + (w > 0 ? ' good' : '');
  } else if (overMax) {
    counter.textContent = `${w} words — over the ${lim.max}-word limit, trim it down`;
    counter.className = 'word-count bad';
  } else if (underMin) {
    counter.textContent = `${w} / ${lim.min} words minimum`;
    counter.className = 'word-count';
  } else {
    counter.textContent = lim.max > 0 ? `${w} words (max ${lim.max}) — looking good` : `${w} words — looking good`;
    counter.className = 'word-count good';
  }
  btn.disabled = underMin || overMax;
}

function goReady(timeRanOut) {
  if (!S || !S.writing || S.writing.ready) return;
  if (!timeRanOut) Sound.click();
  const round = S.writing.round;
  const seconds = Math.max(0, (serverNow() - (S.writing.startedAt || serverNow())) / 1000);

  if (S.mode === 'audio') {
    // Time ran out mid-recording: stop, and let the recorder hand the clip
    // in the moment it has finished saving (see mediaRecorder.onstop)
    if (recording && mediaRecorder) {
      if (timeRanOut) autoSendAudio = seconds;
      try { mediaRecorder.stop(); } catch (e) {}
      if (timeRanOut) return;
    }
    if (!recordedClip && !timeRanOut) return; // nothing to send yet
    socket.emit('ready', { audio: recordedClip, seconds });
  } else {
    const input = document.getElementById('segment-input');
    const text = input ? input.value : (drafts[round] || '');
    drafts[round] = text;
    socket.emit('ready', { text, backspaces: backspaces[round] || 0, seconds });
    saveDraft(round, '');
  }
  if (!timeRanOut) renderedKey = 'sending';
}

/* Play every clip in a story back-to-back (audio mode). */
let chainPlaying = false;
function playChain() {
  const chain = document.getElementById('clip-chain');
  if (!chain) return;
  const players = Array.from(chain.querySelectorAll('audio'));
  if (!players.length) return;
  const btn = document.getElementById('chain-play');
  stopChain();
  chainPlaying = true;
  if (btn) btn.textContent = '⏹ Stop';

  let i = 0;
  const playNext = () => {
    if (!chainPlaying || i >= players.length) { stopChain(); return; }
    const p = players[i];
    p.onended = () => { i++; playNext(); };
    const tryPlay = p.play();
    if (tryPlay && tryPlay.catch) tryPlay.catch(() => { /* autoplay blocked — user can press play */ stopChain(); });
  };
  playNext();
}
function stopChain() {
  chainPlaying = false;
  const chain = document.getElementById('clip-chain');
  if (chain) chain.querySelectorAll('audio').forEach(a => { a.onended = null; });
  const btn = document.getElementById('chain-play');
  if (btn) btn.textContent = '▶ Play all in order';
}

/* Text-to-speech with the browser's built-in voice.
   When the HOST presses the button it goes out to the whole fire: the
   server relays it and every player's device starts (or stops) reading
   the story. Anyone else pressing it hears it on their own device only. */
let ttsActive = false;
function ttsLabel(active) {
  if (active) return '⏹ Stop reading';
  return S && S.isHost ? '🔊 Read aloud to everyone' : '🔊 Read aloud';
}
function toggleReadAloud() {
  if (S && S.isHost) return socket.emit('read_aloud', { on: !ttsActive });   // comes back to us via the relay
  if (ttsActive) stopReadAloud(); else startReadAloud(false);
}
socket.on('read_aloud', ({ on, index } = {}) => {
  if (!S || S.phase !== 'reading' || S.mode === 'audio' || S.reading.index !== index) return;
  if (on) startReadAloud(true); else stopReadAloud();
});

function startReadAloud(fromHost) {
  if (!('speechSynthesis' in window)) {
    showToast('Text-to-speech isn\'t supported in this browser.');
    return;
  }
  const setBtn = () => { const b = document.getElementById('tts-btn'); if (b) b.textContent = ttsLabel(ttsActive); };
  const utter = new SpeechSynthesisUtterance(S.reading.segments.map(s => s.text).join(' '));
  utter.rate = 0.95;
  utter.onend = () => { ttsActive = false; setBtn(); };
  utter.onerror = () => { ttsActive = false; setBtn(); };
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utter);
  ttsActive = true;
  setBtn();
  if (fromHost && !S.isHost) {
    showToast('🔊 The host started the read-aloud');
    // Some phones only let speech start from a tap on that phone
    setTimeout(() => {
      if (ttsActive && !window.speechSynthesis.speaking && !window.speechSynthesis.pending) {
        ttsActive = false; setBtn();
        showToast('Tap 🔊 Read aloud to hear it on this device');
      }
    }, 1500);
  }
}
function stopReadAloud() {
  if ('speechSynthesis' in window) window.speechSynthesis.cancel();
  ttsActive = false;
  const btn = document.getElementById('tts-btn');
  if (btn) btn.textContent = ttsLabel(false);
}

function toggleAuthors(btn) {
  const labels = document.querySelectorAll('.author-label');
  const hidden = labels.length && labels[0].style.display === 'none';
  labels.forEach(l => l.style.display = hidden ? 'block' : 'none');
  btn.textContent = hidden ? 'Hide who wrote what' : 'Show who wrote what';
}

let pendingCamper = null;
function pickCamper(id) {
  pendingCamper = (pendingCamper === id) ? null : id;
  Sound.pop();
  (S.voting.campers || []).forEach(c => {
    const el = document.getElementById('camper-' + c.id);
    if (el) el.classList.toggle('picked', pendingCamper === c.id);
  });
  updateLockButton();
}

function pickGold(i) {
  pendingUp = (pendingUp === i) ? null : i;
  if (pendingDown === i) pendingDown = null;
  Sound.pop();
  paintVotes();
}
function pickBurnt(i) {
  pendingDown = (pendingDown === i) ? null : i;
  if (pendingUp === i) pendingUp = null;
  Sound.pop();
  paintVotes();
}
function paintVotes() {
  S.voting.options.forEach(o => {
    const g = document.getElementById('gold-' + o.index);
    const b = document.getElementById('burnt-' + o.index);
    if (g) g.classList.toggle('picked-gold', pendingUp === o.index);
    if (b) b.classList.toggle('picked-burnt', pendingDown === o.index);
  });
  updateLockButton();
}

function updateLockButton() {
  const lock = document.getElementById('lock-votes');
  if (lock) lock.disabled = (pendingUp === null || pendingDown === null);
}

function startVoteCountdown() {
  clearInterval(voteInterval);
  const tick = () => {
    if (!S || !S.voting || !S.voting.endsAt) return;   // untimed: voting ends when everyone has voted
    const total = S.settings.votingSeconds * 1000;
    const left = Math.max(0, S.voting.endsAt - serverNow());
    const fill = document.getElementById('vote-fill');
    const num = document.getElementById('vote-num');
    if (fill && num) {
      fill.style.width = Math.min(100, left / total * 100) + '%';
      fill.classList.toggle('low', left <= 4000);
      const sec = Math.ceil(left / 1000);
      num.textContent = Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
    }
    if (left <= 0) lockVotes(true); // time's up — send whatever's picked
  };
  tick();
  voteInterval = setInterval(tick, 200);
}

function lockVotes(timeRanOut) {
  if (voteSent) return;
  if (!timeRanOut && (pendingUp === null || pendingDown === null)) return;
  voteSent = true;
  clearInterval(voteInterval);
  socket.emit('cast_vote', { up: pendingUp, down: pendingDown, bestCamper: pendingCamper });
}

/* Build a readable text file of the whole game and download it */
function exportGame() {
  const r = S.results;
  const L = [];
  L.push('CAMPFIRE — Story Night');
  L.push(new Date().toLocaleString());
  if (S.theme) L.push('Theme: ' + S.theme);
  L.push('');
  L.push('========================================');
  L.push('WINNER: ' + r.winners.join(' & '));
  L.push('========================================');
  L.push('');
  r.stories.forEach((story, i) => {
    L.push('----------------------------------------');
    L.push((i + 1) + '. ' + story.ownerName + "'s story");
    const t = r.tally.find(x => x.ownerName === story.ownerName);
    if (t) L.push('   Votes: ' + t.up + ' golden, ' + t.down + ' burnt  (net ' + (t.score >= 0 ? '+' : '') + t.score + ')');
    L.push('');
    story.segments.forEach(seg => {
      L.push('   [' + seg.author + ']');
      if (S.mode === 'audio') {
        L.push('   (audio recording — clips aren\'t saved to this text file)');
      } else {
        // wrap each segment at ~76 chars for readability
        seg.text.replace(/(.{1,72})(\s|$)/g, '$1\n').trim().split('\n').forEach(line => L.push('   ' + line));
      }
      L.push('');
    });
  });
  L.push('========================================');
  L.push('CAMPFIRE AWARDS');
  r.awards.forEach(a => L.push('  ' + a.title + ' (' + a.desc + '): ' + a.name + ' — ' + a.value));
  if (r.bestCampers && r.bestCampers.length) {
    L.push('  Best Overall Camper: ' + r.bestCampers.join(' & '));
  }
  L.push('========================================');

  const blob = new Blob([L.join('\n')], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'campfire-stories.txt';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

/* ==========================================================
   THE SHAREABLE RESULT CARD
   Draws the night's results as a 1080×1350 PNG — night sky,
   winner, the winning opening line, the
   marshmallow tally, and the awards — ready to drop straight
   into the group's Discord. Uses the phone's native share
   sheet when available, otherwise downloads the image.
   ========================================================== */
function shareResultsCard() {
  const r = S.results;
  const W = 1080, H = 1350;
  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const x = cv.getContext('2d');

  // --- night sky ---
  const sky = x.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#33261a'); sky.addColorStop(0.4, '#1a1e28'); sky.addColorStop(1, '#0c1a17');
  x.fillStyle = sky; x.fillRect(0, 0, W, H);
  // stars
  for (let i = 0; i < 90; i++) {
    x.fillStyle = `rgba(239,233,214,${0.25 + Math.random() * 0.6})`;
    const sx = Math.random() * W, sy = Math.random() * H * 0.5, sr = Math.random() * 1.8 + 0.5;
    x.beginPath(); x.arc(sx, sy, sr, 0, 7); x.fill();
  }
  // moon
  x.fillStyle = '#e8d76a'; x.beginPath(); x.arc(950, 110, 46, 0, 7); x.fill();
  x.fillStyle = '#1a1e28'; x.beginPath(); x.arc(930, 96, 38, 0, 7); x.fill();

  // --- arched CAMPFIRE wordmark ---
  x.textAlign = 'center';
  const word = 'CAMPFIRE';
  const arcY = [26, 12, 3, 0, 0, 3, 12, 26];
  x.font = '900 92px system-ui, sans-serif';
  const startX = W / 2 - 355;
  word.split('').forEach((ch, i) => {
    x.save();
    x.translate(startX + i * 101, 150 + arcY[i]);
    x.shadowColor = 'rgba(0,0,0,0.6)'; x.shadowBlur = 14; x.shadowOffsetY = 5;
    x.fillStyle = '#fbf7ec'; x.fillText(ch, 0, 0);
    x.restore();
  });
  x.font = '26px system-ui, sans-serif';
  x.fillStyle = '#b8b3a6';
  x.fillText('Story night results — ' + new Date().toLocaleDateString(), W / 2, 205);
  if (S.theme) {
    x.fillStyle = '#e6c9a3';
    x.fillText('Theme: ' + trimTo(S.theme, 52), W / 2, 240);
  }

  // --- a little campfire ---
  drawCardFire(x, W / 2, 380);

  // --- winner banner ---
  drawMallow(x, W / 2 - 200, 470, 34, 'gold');
  drawMallow(x, W / 2 + 200, 470, 34, 'gold');
  x.fillStyle = '#f0c987';
  x.font = 'bold 34px system-ui, sans-serif';
  x.fillText('WINNER' + (r.winners.length > 1 ? 'S' : ''), W / 2, 458);
  x.fillStyle = '#fbf7ec';
  x.font = '900 52px system-ui, sans-serif';
  x.fillText(trimTo(r.winners.join(' & '), 26), W / 2, 520);

  // the winning story's opening line, as a pull-quote
  const winStory = r.stories.find(st => st.ownerName === r.winners[0]);
  if (winStory && S.mode !== 'audio') {
    x.font = 'italic 30px Georgia, serif';
    x.fillStyle = '#d9d4c6';
    const lines = wrapText(x, '“' + winStory.segments[0].text + '”', 880, 3);
    lines.forEach((ln, i) => x.fillText(ln, W / 2, 578 + i * 40));
  }

  // --- tally ---
  let y = 740;
  x.textAlign = 'left';
  x.font = 'bold 30px system-ui, sans-serif';
  x.fillStyle = '#e98f3e';
  x.fillText('THE TALLY', 110, y); y += 16;
  r.tally.slice(0, 8).forEach(t => {
    y += 52;
    x.fillStyle = 'rgba(18,26,38,0.75)';
    roundRect(x, 92, y - 36, 896, 46, 12); x.fill();
    x.fillStyle = '#f1eee3';
    x.font = '28px system-ui, sans-serif';
    x.fillText(trimTo(t.ownerName, 18) + "'s story", 112, y - 3);
    drawMallow(x, 700, y - 14, 15, 'gold');
    drawMallow(x, 800, y - 14, 15, 'burnt');
    x.fillText(String(t.up), 726, y - 3);
    x.fillText(String(t.down), 826, y - 3);
    x.font = 'bold 28px system-ui, sans-serif';
    x.fillStyle = t.score >= 0 ? '#7cc79a' : '#e8705f';
    x.fillText((t.score >= 0 ? '+' : '') + t.score, 910, y - 3);
  });

  // --- awards ---
  y += 74;
  x.font = 'bold 30px system-ui, sans-serif';
  x.fillStyle = '#e98f3e';
  x.fillText('CAMPFIRE AWARDS', 110, y);
  y += 14;
  r.awards.forEach(a => {
    y += 44;
    x.font = '26px system-ui, sans-serif';
    x.fillStyle = '#f0c987';
    x.fillText(a.title, 112, y);
    x.fillStyle = '#f1eee3';
    x.fillText(a.name + '  ·  ' + a.value, 420, y);
  });
  if (r.bestCampers && r.bestCampers.length) {
    y += 44;
    x.fillStyle = '#f0c987';
    x.fillText('🏕️ Best Overall Camper', 112, y);
    x.fillStyle = '#f1eee3';
    x.fillText(r.bestCampers.join(' & '), 420, y);
  }

  // --- footer ---
  x.textAlign = 'center';
  x.font = '24px system-ui, sans-serif';
  x.fillStyle = '#b8b3a6';
  x.fillText('Round-robin stories around the fire · room ' + S.code, W / 2, H - 40);

  // --- ship it: native share sheet on phones, download elsewhere ---
  const btn = document.getElementById('share-card-btn');
  cv.toBlob(blob => {
    if (!blob) return;
    const file = new File([blob], 'campfire-results.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file], title: 'Campfire — story night results' }).catch(() => {});
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'campfire-results.png';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }
    if (btn) { btn.textContent = '📸 Card ready!'; setTimeout(() => btn.textContent = '📸 Share result card', 2000); }
  }, 'image/png');
}

/* ---------- little canvas helpers for the card ---------- */
function trimTo(s, n) { s = String(s); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

function wrapText(x, text, maxWidth, maxLines) {
  const words = text.split(/\s+/);
  const lines = [];
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (x.measureText(test).width > maxWidth && line) {
      lines.push(line);
      line = w;
      if (lines.length === maxLines - 1) {
        // last line gets whatever fits, then an ellipsis
        let rest = words.slice(words.indexOf(w)).join(' ');
        while (x.measureText(rest + '…').width > maxWidth && rest.includes(' ')) {
          rest = rest.slice(0, rest.lastIndexOf(' '));
        }
        lines.push(rest + (rest === words.slice(words.indexOf(w)).join(' ') ? '' : '…'));
        return lines;
      }
    } else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

function roundRect(x, rx, ry, rw, rh, rad) {
  x.beginPath();
  x.moveTo(rx + rad, ry);
  x.arcTo(rx + rw, ry, rx + rw, ry + rh, rad);
  x.arcTo(rx + rw, ry + rh, rx, ry + rh, rad);
  x.arcTo(rx, ry + rh, rx, ry, rad);
  x.arcTo(rx, ry, rx + rw, ry, rad);
  x.closePath();
}

function drawMallow(x, cx, cy, size, kind) {
  x.save();
  x.fillStyle = kind === 'gold' ? '#f0c987' : '#3a3531';
  x.strokeStyle = kind === 'gold' ? '#c9974f' : '#1f1c19';
  x.lineWidth = size * 0.14;
  roundRect(x, cx - size * 0.85, cy - size * 0.6, size * 1.7, size * 1.2, size * 0.4);
  x.fill(); x.stroke();
  x.restore();
}

function drawCardFire(x, cx, cy) {
  // logs
  x.save();
  x.strokeStyle = '#7a5a3a'; x.lineWidth = 20; x.lineCap = 'round';
  x.beginPath(); x.moveTo(cx - 95, cy + 28); x.lineTo(cx + 75, cy + 62); x.stroke();
  x.beginPath(); x.moveTo(cx + 95, cy + 28); x.lineTo(cx - 75, cy + 62); x.stroke();
  // flame: three teardrop layers
  const flame = (w, h, color, alpha) => {
    x.fillStyle = color; x.globalAlpha = alpha;
    x.beginPath();
    x.moveTo(cx, cy - h);
    x.bezierCurveTo(cx + w, cy - h * 0.35, cx + w * 0.8, cy + 30, cx, cy + 38);
    x.bezierCurveTo(cx - w * 0.8, cy + 30, cx - w, cy - h * 0.35, cx, cy - h);
    x.fill();
  };
  flame(72, 135, '#e6772e', 1);
  flame(50, 100, '#f2a33c', 1);
  flame(28, 62, '#f7d154', 1);
  x.globalAlpha = 1;
  x.restore();
}

/* ---------- Kick things off ---------- */
renderHome();
